{% extends "base.html" %}
{% block title %}Send money — Bank of Katihar{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <p class="eyebrow">Balance: ₹{{ "%.2f"|format(user.balance) }}</p>
    <h1>Send money</h1>
    <form method="POST" action="{{ url_for('transfer') }}" class="form">
      <label>Recipient account number or username
        <input type="text" name="to_account" required autofocus placeholder="BOK00000002">
      </label>
      <label>Amount (₹)
        <input type="number" name="amount" required min="1" step="0.01" placeholder="500">
      </label>
      <label>Note (optional)
        <input type="text" name="note" placeholder="e.g. rent, lunch split">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Send</button>
    </form>
    <p class="auth-switch"><a href="{{ url_for('dashboard') }}">&larr; Back to dashboard</a></p>
  </div>
</section>
{% endblock %}
